name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/yookassa-integration-agent/server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: plugins/yookassa-integration-agent/server

      - name: Validate plugin repository
        run: node scripts/validate-plugin.mjs

      - name: Check types
        run: npm run check
        working-directory: plugins/yookassa-integration-agent/server

      - name: Run tests
        run: npm test
        working-directory: plugins/yookassa-integration-agent/server

      - name: Rebuild standalone MCP bundle
        run: npm run build
        working-directory: plugins/yookassa-integration-agent/server

      - name: Verify committed bundle
        run: git diff --exit-code -- plugins/yookassa-integration-agent/server/dist/index.js
